organization:
  description: >-
    Horama Apps is an incubator and seedbed for independent applications.
    We build useful products, bring them to their first community, and seek
    sponsorships, partnerships, or funding to give them infrastructure and continuity.
  partnerships:
    - Sponsorship
    - Infrastructure
    - Distribution
    - Funding
    - Technical collaboration

apps:
  framewise:
    tagline: Your archive. Your judgment. Now on iPhone too.
    summary: >-
      Framewise analyzes, scores, and organizes photo shoots from the desktop
      or its iPhone companion app connected to your local service. Horama never
      receives, stores, or trains on your photographs.
    pitch: >-
      Your photo archive should not have to trade privacy for intelligent tools.
      Framewise finds the strongest frames, explains why they work, and helps
      improve only what needs attention. On iPhone, you can choose photos from
      your library, send them to your own analysis service, and review results
      and edited versions in a private mobile experience. Originals remain
      untouched, and your decisions remain yours.
    opportunity_title: Editorial judgment, now on your iPhone too.
    opportunity_body: >-
      Work through full shoots on your computer or select photos from your iPhone
      library. Framewise connects both workflows with explainable analysis, a
      private queue, and edits that respect subject, composition, and intent.
    opportunity_highlights:
      - iPhone companion app
      - Originals stay untouched
      - Processing under your control
    audience: [Photographers, Mobile creators, Creative studios]
    features:
      - "Desktop and iPhone: analyze complete folders or choose photos directly from your iOS library"
      - "Explainable culling: critique, scoring, duplicates, and editorial decisions in a private per-device library"
      - "Complete workflow: analysis queue, faithful editing, local versions, and captions for sharing without touching the original"
    demo_label: DEMO / REAL WORKFLOW
    demo_title: A complete desktop shoot, connected to iPhone.
    demo_caption: >-
      A real Framewise walkthrough: contact sheet, explainable analysis, and an
      edited-version library. The companion app brings selection, progress, and
      results to iPhone while the analysis service remains under your control.
    demo_alt: Framewise demo analyzing a photo shoot connected to its iPhone app
    status_label: Desktop v1 · iPhone companion
    support_ask: We are looking for photographers, mobile creators, and studios to test the desktop-to-iPhone workflow, plus distribution and local-hardware partners.
    roadmap:
      - { title: Privacy by architecture, description: "Photos, analyses, and decisions stay on the user's computer", state: done }
      - { title: Explainable professional culling, description: "Critique, ranking, duplicates, comparison, decisions, XMP, and recoverable cleanup", state: done }
      - { title: iPhone companion, description: "PhotoKit selection, private libraries, analysis queue, edits, and captions from iOS", state: done }

  horama-3d:
    tagline: Configure, visualize, and manufacture in one place.
    summary: >-
      A web configurator that turns models and images into printable 3D parts,
      directly in the browser and without external services.
    pitch: >-
      Horama 3D brings parametric customization to any browser. It combines a
      viewer, STL validation, local geometry, and export in one experience. Its
      modules turn models, images, and text into manufacturing-ready products
      without sending the user's files to another service.
    audience: [Makers, Digital manufacturing, E-commerce]
    features:
      - "Local processing: viewer, STL validation, and in-browser geometry generation"
      - "Ready modules: lamps, urns, clickers, textures, signs, and bracelets"
      - "Image Layers: color quantization and multicolor 3MF export"
    product_cta_label: View Configurator ↓
    embed_label: INTERACTIVE CONFIGURATOR
    embed_title: Design a piece from scratch.
    embed_caption: >-
      Try the sign generator directly here. This demo lets you configure and
      preview the model while keeping downloads disabled.
    status_label: Public v1.0
    support_ask: We are looking for pilot shops, infrastructure support, and web 3D experts.
    roadmap:
      - { title: Local 3D engine, description: "In-browser loading, validation, orbiting, auto-framing, and geometry operations", state: done }
      - { title: Modular catalog, description: "Lamps, cavity-and-rib urns, clickers, textures, signs, and bracelets", state: done }
      - { title: Multicolor Image Layers, description: "A quantized image converted into color layers and packaged as 3MF", state: done }
      - { title: Image keychains, description: "A new image-to-geometry module with manufacturing controls", state: current }
      - { title: Commercial configurator, description: "Catalog, quoting, and checkout", state: next }

  genai-studio:
    tagline: Your AI content studio, on any screen.
    summary: >-
      A simple responsive interface that turns AI workflows into production
      tools available from iPhone, Android, or desktop.
    pitch: >-
      GenAI Studio turns a self-hosted ComfyUI installation into a production
      studio the whole team can use. Businesses, influencers, and creators can
      edit images, transform styles, generate audio, and download results without
      navigating technical graphs. Every new workflow becomes a clear, reusable
      tool ready to use from a phone or computer.
    opportunity_title: Fewer nodes. More content ready to publish.
    opportunity_body: >-
      Bring your AI workflows into an interface your creative team understands.
      Choose a format, upload references, write the instruction, and follow the
      result in one queue using your own infrastructure.
    opportunity_highlights:
      - Mobile-first design
      - Reusable workflows
      - Your own infrastructure
    audience: [Businesses and brands, Influencers, Content creators]
    features:
      - "Multi-format production: image editing and simplification, voice generation, and a space ready for video"
      - "No technical complexity: clear forms, uploads, microphone recording, job queue, and result downloads"
      - "Extensible catalog: add new ComfyUI workflows without rewriting the interface or backend"
    status_label: Functional alpha
    support_ask: We are looking for businesses, influencers, and content teams to design repeatable workflows, plus partners in GPU infrastructure and creative distribution.
    roadmap:
      - { title: Responsive studio, description: "iPhone, Android, and desktop interface with asynchronous jobs and downloadable results", state: done }
      - { title: Image and voice, description: "Visual editing, style simplification, and text-to-voice with reference audio", state: done }
      - { title: Content workflows, description: "Presets for campaigns, products, social media, and video production", state: current }
      - { title: Team spaces, description: "Shared library, permissions, and history for each brand or creator", state: next }

  kiroku:
    tagline: Your private memory, ready when you return.
    summary: >-
      A personal-memory system for iPhone and Apple Watch that turns voice, shared
      audio, and video into private notes, tasks, answers, and concept maps.
    pitch: >-
      Important ideas, agreements, and memories often appear when there is no time
      to write. Kiroku captures them from iPhone, Apple Watch, widgets, or the Share
      Sheet and turns them into structured memory. Ask Kiroku answers with navigable
      sources, tasks retain their link to the original note, and concept maps reveal
      relationships among people, projects, places, themes, and decisions. SwiftData
      keeps iPhone as the source of truth while PostgreSQL, pgvector, Whisper, and
      Ollama operate behind a private API.
    opportunity_title: Capture once. Remember, connect, and act later.
    opportunity_body: >-
      Every memory can become a searchable note, a task with a due date and priority,
      a source for a private answer, or a node in a concept map. Groups share only
      the notes you choose without transferring ownership or opening your full library.
    opportunity_highlights:
      - Capture on iPhone, Apple Watch, and Share Sheet
      - Ask Kiroku and sourced concept maps
      - Private groups with note-level control
    audience: [People with many ideas, Professionals and meetings, Families and private groups]
    features:
      - "Capture where ideas happen: recording on iPhone and Apple Watch, widgets, Control Center, and a Share Extension for audio or video"
      - "Memory that works with you: structured notes, editable tasks, hybrid Ask Kiroku retrieval, and navigable concept maps"
      - "Privacy with explicit collaboration: local SwiftData, an authenticated API, Keychain sessions, and groups that share only each selected note"
    status_label: Private alpha · iPhone + Watch
    support_ask: We are looking for iPhone and Apple Watch users to test everyday capture, tasks, Ask Kiroku, concept maps, widgets, and private groups before expanding synchronization and proactive recall.
    roadmap:
      - { title: Capture and persistent memory, description: "SwiftUI, SwiftData, native recording, Share Extension, and private Whisper/Ollama jobs", state: done }
      - { title: Intelligence with sources, description: "Structured tasks, hybrid Ask Kiroku retrieval, and concept maps linked to every source note", state: done }
      - { title: Kiroku around you, description: "Apple Watch, widgets, Control Center, Action button, Google authentication, and private groups", state: done }
      - { title: Multi-device memory, description: "Authenticated sync, reminders, recurring tasks, calendar integration, and contextual recall", state: current }
      - { title: Physical and proactive recall, description: "Seeed Studio ReSpeaker, Seeed Studio Thermal Sticky, and configurable digests with explicit privacy controls", state: next }
