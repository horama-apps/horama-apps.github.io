organization:
  name: Horama Apps
  description: >-
    Horama Apps es una incubadora y semillero de aplicaciones independientes.
    Creamos productos útiles, los llevamos a una primera comunidad y buscamos
    patrocinio, partnerships o funding para darles infraestructura y continuidad.
  github: https://github.com/horama-apps
  partnerships:
    - Patrocinio
    - Infraestructura
    - Distribución
    - Funding
    - Colaboración técnica

apps:
  - slug: framewise
    name: Framewise
    monogram: FW
    logo: /apps/framewise/logo.svg
    theme: dark
    tagline: Tus fotos. Tu criterio. Tu computadora.
    summary: >-
      Framewise analiza, califica y ordena sesiones fotográficas completas sin
      que una sola imagen abandone tu computadora. Horama no recibe, almacena
      ni entrena con tus fotografías.
    pitch: >-
      Tu archivo fotográfico no debería pagar con privacidad la comodidad de una
      herramienta inteligente. Framewise encuentra las tomas más fuertes, explica
      por qué funcionan y ayuda a mejorar únicamente lo necesario. Su servicio de
      edición fiel sigue las recomendaciones del análisis sin reinventar la foto:
      respeta al sujeto, la composición y la intención de la toma, mientras el
      original permanece siempre intacto. Tus imágenes y tus decisiones siguen siendo tuyas.
    opportunity_title: Privacidad local. Criterio editorial.
    opportunity_body: >-
      Framewise encuentra las tomas más fuertes y explica por qué funcionan sin
      sacar tu archivo de la computadora. Cuando una imagen puede mejorar, propone
      cambios precisos que respetan al sujeto, la composición y la intención de la toma.
    opportunity_highlights:
      - Cero uploads
      - Originales intactos
      - Decisiones bajo tu control
    audience: [Fotógrafos, Editores de fotografía, Estudios creativos]
    features:
      - "Privacidad real: sin uploads, sin nube y sin almacenamiento en servidores de Horama"
      - "Selección explicable: crítica, puntuación, duplicados y decisiones editoriales bajo tu control"
      - "Edición fiel y no destructiva: mejora desde las recomendaciones sin reemplazar tu mirada ni tocar el original"
    version: 1.0.0
    status: stable
    status_label: v1.0 local
    color: "#d8ff4f"
    ink: "#0b0d0b"
    accent: "#ff8a4b"
    related_apps: [itp]
    demo: /apps/framewise/framewise-demo.gif
    demo_label: DEMO / FLUJO REAL
    demo_title: Una sesión completa, sin salir de tu computadora.
    demo_caption: >-
      Recorrido real por Framewise: contact sheet, análisis explicable y biblioteca
      de versiones editadas. Las fotografías y sus resultados permanecen locales.
    demo_alt: Demostración de Framewise analizando y organizando una sesión fotográfica local
    support_ask: Buscamos fotógrafos y estudios que quieran demostrar que una experiencia inteligente puede ser poderosa sin apropiarse de su archivo, además de aliados de distribución y hardware local.
    roadmap:
      - { title: Privacidad por arquitectura, description: "Fotografías, análisis y decisiones permanecen en el equipo del usuario", state: done }
      - { title: Selección profesional explicable, description: "Crítica, ranking, duplicados, comparación, decisiones, XMP y limpieza recuperable", state: done }
      - { title: Edición fiel y no destructiva, description: "Mejoras guiadas por el análisis, versiones locales y originales siempre intactos", state: done }

  - slug: itp
    name: ITP
    monogram: ITP
    tagline: De una imagen a una intención que sí se puede usar.
    summary: >-
      Un laboratorio para traducir referencias visuales en prompts claros,
      editables y reutilizables.
    pitch: >-
      ITP ayuda a equipos creativos a entender qué hace funcionar una imagen y
      convertirlo en instrucciones que se pueden iterar, compartir y reproducir.
    audience: [Diseño, Marketing, Equipos de IA]
    features:
      - Lectura estructurada de referencias
      - Prompts editables por capas
      - Historial de iteraciones
    version: 0.1.1
    status: alpha
    status_label: Alpha
    color: "#9d7cff"
    ink: "#17131f"
    accent: "#e5dcff"
    related_apps: [horama-3d, framewise]
    support_ask: Buscamos créditos de inferencia, diseñadores piloto y aliados de creative tech.
    roadmap:
      - { title: Imagen a prompt, description: Flujo principal de análisis, state: done }
      - { title: Editor por capas, description: "Control de estilo, luz y composición", state: current }
      - { title: Librería de equipos, description: Presets y colaboración, state: next }

  - slug: horama-3d
    name: Horama 3D
    monogram: H3
    logo: /apps/horama-3d/mark.png
    tagline: Configura, visualiza y fabrica en un solo lugar.
    summary: >-
      Un configurador web que transforma modelos e imágenes en piezas 3D
      imprimibles, directamente en el navegador y sin servicios externos.
    pitch: >-
      Horama 3D acerca la personalización paramétrica a cualquier navegador.
      Reúne visor, validación STL, geometría local y exportación en una sola
      experiencia. Sus módulos convierten modelos, imágenes y texto en productos
      listos para fabricar sin enviar los archivos del usuario a otro servicio.
    audience: [Makers, Fabricación digital, E-commerce]
    features:
      - "Procesamiento local: visor, validación STL y generación de geometría en el navegador"
      - "Módulos listos: lámparas, urnas, clickers, texturas, letreros y brazaletes"
      - "Imagen por capas: cuantización por color y exportación multicolor en 3MF"
    version: 1.0.0
    status: stable
    status_label: v1.0 pública
    color: "#ffc400"
    ink: "#111111"
    accent: "#fff3b0"
    related_apps: [itp]
    repo: https://github.com/horama-apps/Horama3D
    product_url: https://horama-apps.github.io/Horama3D/?demo=true
    product_cta_label: Ver Configurador ↓
    embed_url: https://horama-apps.github.io/Horama3D/?demo=true
    embed_label: CONFIGURADOR INTERACTIVO
    embed_title: Diseña una pieza desde cero.
    embed_caption: >-
      Prueba el generador de letreros directamente aquí. Esta demostración permite
      configurar y visualizar el modelo, pero mantiene la descarga deshabilitada.
    support_ask: Buscamos comercios piloto, soporte de infraestructura y expertos en 3D web.
    roadmap:
      - { title: Motor 3D local, description: "Carga, validación, órbita, autoencuadre y operaciones geométricas en el navegador", state: done }
      - { title: Catálogo modular, description: "Lámparas, urnas con cavidad y ribs, clickers, texturas, letreros y brazaletes", state: done }
      - { title: Image Layers multicolor, description: "Imagen cuantizada convertida en capas de color y empaquetada como 3MF", state: done }
      - { title: Llaveros desde imagen, description: "Nuevo módulo de imagen a geometría con controles de fabricación", state: current }
      - { title: Configurador comercial, description: "Catálogo, cotización y checkout", state: next }

  - slug: med
    name: MED
    monogram: M+
    tagline: Herramientas digitales más humanas para el trabajo clínico.
    summary: >-
      Un espacio de experimentación para reducir fricción en flujos de salud,
      con privacidad y claridad como requisitos desde el inicio.
    pitch: >-
      MED explora cómo el software puede devolver tiempo y contexto a los
      profesionales de salud. Está en etapa de descubrimiento y busca construir
      junto a expertos, no alrededor de ellos.
    audience: [Profesionales de salud, Clínicas, Health tech]
    features:
      - Diseño centrado en el flujo clínico
      - Privacidad como principio de producto
      - Prototipado con especialistas
    version: pending
    status: research
    status_label: Investigación
    color: "#4b8cff"
    ink: "#0b1830"
    accent: "#d8e6ff"
    support_ask: Buscamos asesores clínicos, instituciones piloto y aliados de health tech.
    roadmap:
      - { title: Descubrimiento, description: Entrevistas y definición del problema, state: current }
      - { title: Prototipo seguro, description: Primer flujo validable y privado, state: next }
      - { title: Piloto clínico, description: Validación supervisada en contexto, state: next }
